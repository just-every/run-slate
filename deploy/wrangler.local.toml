name = "slate-local"
main = "../src/server.ts"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "slate-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations/core"

[[r2_buckets]]
binding = "FILES"
bucket_name = "slate-local-files"

[[queues.producers]]
binding = "JOBS"
queue = "slate-local-jobs"

[[durable_objects.bindings]]
name = "CONTENT_COLLABORATION"
class_name = "ContentCollaboration"

[[migrations]]
tag = "v1-content-collaboration"
new_sqlite_classes = ["ContentCollaboration"]

[[queues.consumers]]
queue = "slate-local-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[triggers]
crons = ["* * * * *"]
