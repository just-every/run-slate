  contract:
    needs: [plan, shards, app]
    if: needs.plan.outputs.skip != 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Emitted-Worker first-open and sign-in acceptance launch Chromium.
      - name: Install Chromium
        run: bash .github/scripts/install-browsers.sh
      - uses: actions/download-artifact@v4
        with:
          name: verified-app-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: contract-*
          path: .artifacts/contract-shards
          merge-multiple: true
      - run: node scripts/verify.mjs
        env:
          SLATE_WORKERS_REPORTS: .artifacts/contract-shards
  local-journeys:
    needs: [plan, app]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: bash .github/scripts/install-browsers.sh
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: verified-app-build
          path: .
      - run: pnpm build
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm test:installer && pnpm test:local-journey
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-journey-failures
          path: .artifacts/local-journey/*-failure.log
          if-no-files-found: ignore

  import-scale:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/e2e/imports/undo-cross-references.test.ts

  verify:
    needs: [plan, app, shards, contract, local-journeys, import-scale]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every expected job
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          APP: ${{ needs.app.result }}
          SHARDS: ${{ needs.shards.result }}
          CONTRACT: ${{ needs.contract.result }}
          LOCAL: ${{ needs.local-journeys.result }}
          SCALE: ${{ needs.import-scale.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          # Dispatch has always been the installer/local-only entry point.
          if [ "$EVENT" != workflow_dispatch ]; then
            for result in "$APP" "$SHARDS" "$CONTRACT"; do test "$result" = success; done
          fi
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [[ "$REF" == refs/tags/* ]]; then
            test "$LOCAL" = success
          fi
          if [ "$EVENT" = schedule ] || [[ "$REF" == refs/tags/* ]]; then
            test "$SCALE" = success
          fi
