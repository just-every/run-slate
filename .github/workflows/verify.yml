name: Verify Slate
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '30 17 * * *'
permissions:
  contents: read
jobs:
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --shard=${{ matrix.shard }}/6 --testNamePattern="^(?!Undo removes unedited and merely shared imported pages).*$" --reporter=default --reporter=json --outputFile=.artifacts/contract-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-${{ matrix.shard }}
          path: .artifacts/contract-${{ matrix.shard }}.json
  contract:
    needs: workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: contract-*
          path: .artifacts/contract-shards
          merge-multiple: true
      - run: pnpm build && node scripts/verify.mjs
        env:
          SLATE_WORKERS_REPORTS: .artifacts/contract-shards
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: app
            command: node scripts/sync-project-setup.mjs --check && pnpm verify
          - suite: core
            command: pnpm build && pnpm test:foundation && pnpm test:platform && pnpm test:profile && pnpm test:local-outbox
          - suite: tooling
            command: pnpm build && pnpm test:base-proof && pnpm test:docs && pnpm test:typegen && pnpm test:portability && pnpm test:release-source && pnpm test:rer-editor
          - suite: delivery
            command: pnpm build && pnpm test:delivery-artifact && pnpm test:release-regressions
          - suite: ui-desktop
            command: pnpm build && node --test --test-concurrency=1 --test-name-pattern=1440 tests/ui/polish-journeys.test.mjs tests/qualification/ui-convergence/journeys.test.mjs
          - suite: ui-mobile
            command: pnpm build && node --test --test-concurrency=1 --test-name-pattern=390 tests/ui/polish-journeys.test.mjs tests/qualification/ui-convergence/journeys.test.mjs
          - suite: ui-state
            command: pnpm build && pnpm test:ui:reachability && pnpm test:ui:state
    name: verify (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: ${{ matrix.command }}
      - name: Retain failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.suite }}
          path: .artifacts/
          if-no-files-found: ignore
  local-journeys:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Prepare runner disk
        run: sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:installer && pnpm test:local-journey
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-journey-failures
          path: .artifacts/local-journey/*-failure.log
          if-no-files-found: ignore

  import-scale:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/e2e/imports/undo-cross-references.test.ts
