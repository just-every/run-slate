name: Verify Slate
on:
  push:
    branches: [main, 'cloud/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 17 * * *'
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Only the newest same-repository push of this workflow is evidence.
          # PR merge refs, dispatch subsets, forks and this run cannot satisfy it.
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: reuse the exact candidate's green push after landing on main.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3: an identical parent tree, with the parent's newest push green.
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: a same-repository PR may reuse only its own green push head.
          # Missing/red evidence runs in full; wait at most 25 minutes if running.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          # Tags also require installer/local and scale assertions. A normal push
          # is no nightly marker: never reuse it to bypass these release doors.
          if [[ "$REF" == refs/tags/* ]]; then skip=false; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  app:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && github.event_name != 'workflow_dispatch'
    name: verify (app)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # rer verify also checks hosted output and page hydration in Chromium.
      - name: Install Chromium
        run: bash .github/scripts/install-browsers.sh
      - run: node src/base/runtime/contract-docs.mjs check
      - run: node scripts/sync-project-setup.mjs --check && pnpm verify
      # Every shard and contract acceptance consume this one verified build.
      - uses: actions/upload-artifact@v4
        with:
          name: verified-app-build
          # Keep the build provenance used by browser evidence with its bytes.
          path: |
            dist/
            .cache/slate/build-source.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Retain failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-app
          path: .artifacts/
          if-no-files-found: ignore
  shards:
    needs: [plan, app]
    if: needs.plan.outputs.skip != 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            ui: 1
            worker: 4
            browser: true
            command: node --test .github/scripts/journey-shard.test.mjs && pnpm test:foundation && pnpm test:platform && pnpm test:profile && pnpm test:local-outbox && pnpm exec tsx --test --test-concurrency=1 tests/flagship/core/mail.node.test.mts
          - suite: tooling
            ui: 2
            worker: 1
            browser: true
            command: pnpm test:base-proof && pnpm test:docs && pnpm test:typegen && pnpm test:portability && pnpm test:release-source && pnpm test:rer-editor
          - suite: delivery
            ui: 3
            worker: 2
            browser: true
            command: pnpm test:delivery-artifact && pnpm test:release-regressions
          - suite: ui-state
            ui: 4
            worker: 5
            browser: true
            command: pnpm test:ui:reachability && pnpm test:ui:state && node --test --test-concurrency=1 --test-name-pattern='^insertion recovery' tests/ui/polish-journeys.test.mjs
          - suite: ui-focus-desktop
            serial: true
            ui: 5
            worker: 0
            browser: true
            command: node --test --test-concurrency=1 --test-name-pattern='^genuine insertion focus.*1440' tests/ui/polish-journeys.test.mjs
          - suite: ui-focus-mobile
            serial: true
            ui: 6
            worker: 0
            browser: true
            command: node --test --test-concurrency=1 --test-name-pattern='^genuine insertion focus.*390' tests/ui/polish-journeys.test.mjs
          - suite: ui-polish-desktop
            ui: 7
            worker: 6
            browser: true
            command: node --test --test-concurrency=1 --test-name-pattern='^visible Slate polish.*1440' tests/ui/polish-journeys.test.mjs
          - suite: ui-polish-mobile
            ui: 8
            worker: 3
            browser: true
            command: node --test --test-concurrency=1 --test-name-pattern='^visible Slate polish.*390' tests/ui/polish-journeys.test.mjs
    name: verify (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: matrix.browser
        run: bash .github/scripts/install-browsers.sh
      - uses: actions/download-artifact@v4
        with:
          name: verified-app-build
          path: .
      # The browser owns its workspace; the other lane owns its Workers/suite
      # processes. Join both and retain each exit status before aggregation.
      - name: Workers, public-door journeys and suite
        env:
          SLATE_UI_SHARD: ${{ matrix.ui }}/8
          SLATE_UI_ASSIGNMENTS: .github/scripts/journey-shards.json
          SERIAL_SUITE: ${{ matrix.serial == true && 'true' || 'false' }}
          WORKER_SHARD: ${{ matrix.worker }}
          SUITE_COMMAND: ${{ matrix.command }}
        run: bash .github/scripts/run-shard.sh
      - uses: actions/upload-artifact@v4
        if: always() && matrix.worker != 0
        with:
          name: contract-${{ matrix.worker }}
          path: .artifacts/contract-${{ matrix.worker }}.json
          if-no-files-found: error
      - name: Retain failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failures-${{ matrix.suite }}
          path: .artifacts/
          if-no-files-found: ignore
  contract:
    needs: [plan, shards, app]
    if: needs.plan.outputs.skip != 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Emitted-Worker first-open and sign-in acceptance launch Chromium.
      - name: Install Chromium
        run: bash .github/scripts/install-browsers.sh
      - uses: actions/download-artifact@v4
        with:
          name: verified-app-build
          path: .
      - uses: actions/download-artifact@v4
        with:
          pattern: contract-*
          path: .artifacts/contract-shards
          merge-multiple: true
      - run: node scripts/verify.mjs
        env:
          SLATE_WORKERS_REPORTS: .artifacts/contract-shards
  local-journeys:
    needs: [plan, app]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: bash .github/scripts/install-browsers.sh
      - uses: actions/download-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: verified-app-build
          path: .
      - run: pnpm build
        if: github.event_name == 'workflow_dispatch'
      - run: pnpm test:installer && pnpm test:local-journey
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-journey-failures
          path: .artifacts/local-journey/*-failure.log
          if-no-files-found: ignore

  import-scale:
    needs: plan
    if: needs.plan.outputs.skip != 'true' && (github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/e2e/imports/undo-cross-references.test.ts

  verify:
    needs: [plan, app, shards, contract, local-journeys, import-scale]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every expected job
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          APP: ${{ needs.app.result }}
          SHARDS: ${{ needs.shards.result }}
          CONTRACT: ${{ needs.contract.result }}
          LOCAL: ${{ needs.local-journeys.result }}
          SCALE: ${{ needs.import-scale.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          # Dispatch has always been the installer/local-only entry point.
          if [ "$EVENT" != workflow_dispatch ]; then
            for result in "$APP" "$SHARDS" "$CONTRACT"; do test "$result" = success; done
          fi
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [[ "$REF" == refs/tags/* ]]; then
            test "$LOCAL" = success
          fi
          if [ "$EVENT" = schedule ] || [[ "$REF" == refs/tags/* ]]; then
            test "$SCALE" = success
          fi
