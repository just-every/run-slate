name: Deploy Slate

# Deploy only through manual dispatch after configuring the selected environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment approved by the owner
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SLATE_DEPLOY_ENV: ${{ inputs.environment }}
      SLATE_APP_URL: ${{ inputs.environment == 'preview' && vars.SLATE_PREVIEW_URL || vars.SLATE_PRODUCTION_URL }}
      SLATE_SETUP_OWNER_EMAIL: ${{ vars.SLATE_SETUP_OWNER_EMAIL }}
      SLATE_MAIL_PROVIDER: ${{ vars.SLATE_MAIL_PROVIDER }}
      SLATE_MAIL_FROM: ${{ vars.SLATE_MAIL_FROM }}
      SLATE_SESSION_SECRET: ${{ secrets.SLATE_SESSION_SECRET }}
      SLATE_MAIL_API_KEY: ${{ secrets.SLATE_MAIL_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm run deploy
